name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test AmbitKit
        run: swift test
      - name: Build app (unsigned)
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Ambit.xcodeproj -scheme Ambit -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
